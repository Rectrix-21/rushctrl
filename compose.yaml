name: rushctrl

services:
  database:
    image: postgres:18.6-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?Run scripts/setup.ps1 first}
      POSTGRES_DB: ${POSTGRES_DB:?Run scripts/setup.ps1 first}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Run scripts/setup.ps1 first}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-55432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 3s
      timeout: 3s
      retries: 15

  migrate:
    build:
      context: .
      dockerfile: src/RushCtrl.Api/Dockerfile
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      Demo__Enabled: "true"
      Demo__ManagerPassword: ${DEMO_MANAGER_PASSWORD:?Run scripts/setup.ps1 to generate demo passwords}
      Demo__EmployeePassword: ${DEMO_EMPLOYEE_PASSWORD:?Run scripts/setup.ps1 to generate demo passwords}
      ConnectionStrings__Database: "Host=database;Database=${POSTGRES_DB:?};Username=${POSTGRES_USER:?};Password=${POSTGRES_PASSWORD:?}"
    command: ["--migrate", "--seed-demo"]
    depends_on:
      database:
        condition: service_healthy
    restart: "no"

  api:
    build:
      context: .
      dockerfile: src/RushCtrl.Api/Dockerfile
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ConnectionStrings__Database: "Host=database;Database=${POSTGRES_DB:?};Username=${POSTGRES_USER:?};Password=${POSTGRES_PASSWORD:?}"
    ports:
      - "127.0.0.1:${API_PORT:-5080}:8080"
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8080/health/ready"]
      interval: 5s
      timeout: 4s
      retries: 12

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args:
        API_BASE_URL: http://api:8080
    ports:
      - "127.0.0.1:${WEB_PORT:-3000}:3000"
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 10

volumes:
  postgres-data:
