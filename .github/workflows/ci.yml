name: Checks
on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  api:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18.6-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_DB: postgres
          POSTGRES_HOST_AUTH_METHOD: trust
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 3s --health-retries 12
    env:
      DOTNET_CLI_TELEMETRY_OPTOUT: 1
      RUSHCTRL_TEST_DATABASE_CONNECTION: Host=127.0.0.1;Port=5432;Database=postgres;Username=postgres
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - run: dotnet build RushCtrl.slnx -c Release --nologo
      - run: dotnet test RushCtrl.slnx -c Release --no-build --logger "console;verbosity=minimal"

  web:
    runs-on: ubuntu-latest
    env:
      NEXT_TELEMETRY_DISABLED: 1
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm test
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run build
      - run: npx playwright install --with-deps chromium
        working-directory: apps/web
      - run: npm run test:e2e

  compose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Generate ephemeral local configuration
        run: |
          printf 'POSTGRES_USER=rushctrl\nPOSTGRES_DB=rushctrl\nPOSTGRES_PASSWORD=%s\nPOSTGRES_PORT=55432\nAPI_PORT=5080\nWEB_PORT=3000\n' "$(openssl rand -hex 24)" > .env
      - run: docker compose up --build --wait --wait-timeout 180
      - run: curl --fail http://127.0.0.1:3000/api/v1/system && curl --fail http://127.0.0.1:3000/health/ready
      - if: always()
        run: docker compose down
