name: Checks
on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  api:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18.6-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_DB: postgres
          POSTGRES_HOST_AUTH_METHOD: trust
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 3s --health-retries 12
    env:
      DOTNET_CLI_TELEMETRY_OPTOUT: 1
      RUSHCTRL_TEST_DATABASE_CONNECTION: Host=127.0.0.1;Port=5432;Database=postgres;Username=postgres
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - run: dotnet build RushCtrl.slnx -c Release --nologo
      - run: dotnet test RushCtrl.slnx -c Release --no-build --logger "console;verbosity=minimal"

  web:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18.6-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_DB: postgres
          POSTGRES_HOST_AUTH_METHOD: trust
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 3s --health-retries 12
    env:
      NEXT_TELEMETRY_DISABLED: 1
      ASPNETCORE_ENVIRONMENT: Development
      ConnectionStrings__Database: Host=127.0.0.1;Port=5432;Database=postgres;Username=postgres
      Demo__Enabled: "true"
      Simulation__Enabled: "true"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - run: npm ci --no-audit --no-fund
      - name: Generate isolated demo credentials
        run: |
          node scripts/create-env.mjs
          node --input-type=module <<'NODE'
          import { loadEnvFile } from 'node:process';
          import { appendFileSync } from 'node:fs';
          loadEnvFile('.env');
          for (const [source, target] of [['DEMO_MANAGER_PASSWORD', 'Demo__ManagerPassword'], ['DEMO_EMPLOYEE_PASSWORD', 'Demo__EmployeePassword']]) {
            const value = process.env[source];
            console.log(`::add-mask::${value}`);
            appendFileSync(process.env.GITHUB_ENV, `${source}=${value}\n${target}=${value}\n`);
          }
          NODE
      - run: dotnet build src/RushCtrl.Api -c Release --nologo
      - name: Migrate seed and start the real API
        run: |
          if ! dotnet src/RushCtrl.Api/bin/Release/net10.0/RushCtrl.Api.dll --migrate --seed-demo > "$RUNNER_TEMP/migrate.log" 2>&1; then
            cat "$RUNNER_TEMP/migrate.log"
            exit 1
          fi
          ASPNETCORE_URLS=http://127.0.0.1:5080 dotnet src/RushCtrl.Api/bin/Release/net10.0/RushCtrl.Api.dll > "$RUNNER_TEMP/api.log" 2>&1 &
          for attempt in {1..30}; do
            if curl --fail --silent --output /dev/null http://127.0.0.1:5080/health/ready; then exit 0; fi
            sleep 1
          done
          cat "$RUNNER_TEMP/api.log"
          exit 1
      - run: npm test
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run build
      - run: npx playwright install --with-deps chromium
        working-directory: apps/web
      - run: npm run test:e2e

  compose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Generate ephemeral local configuration
        run: node scripts/create-env.mjs
      - run: npm ci --no-audit --no-fund
      - run: docker compose up --build --wait --wait-timeout 180
      - run: curl --fail http://127.0.0.1:3000/api/v1/system && curl --fail http://127.0.0.1:3000/health/ready
      - run: node scripts/smoke-workflow.mjs
      - name: Report failed container output
        if: failure()
        run: |
          docker compose ps --all
          node --input-type=module <<'NODE'
          import { readFileSync } from 'node:fs';
          import { spawnSync } from 'node:child_process';
          const result = spawnSync('docker', ['compose', 'logs', '--no-color', '--tail', '120'], { encoding: 'utf8' });
          let output = (result.stdout ?? '') + (result.stderr ?? '');
          for (const line of readFileSync('.env', 'utf8').split(/\r?\n/)) {
            const separator = line.indexOf('=');
            if (separator < 0 || !line.slice(0, separator).endsWith('PASSWORD')) continue;
            const password = line.slice(separator + 1);
            if (password) output = output.replaceAll(password, '[redacted]');
          }
          console.log(output);
          const annotation = output.slice(-12000).replaceAll('%', '%25').replaceAll('\r', '%0D').replaceAll('\n', '%0A');
          console.log(`::error title=Failed Compose container output::${annotation || 'No container output was available.'}`);
          NODE
      - if: always()
        run: docker compose down
